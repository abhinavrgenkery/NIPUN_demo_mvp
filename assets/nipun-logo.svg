<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" fill="none">
  <!-- Symbol: Abstract 'N' with upward career vector and connected placement nodes -->
  <g transform="translate(10, 10)">
    <!-- Node 1: Foundation (Education/Upskilling) - Deep Blue -->
    <circle cx="24" cy="88" r="14" fill="#123C69" />
    <circle cx="24" cy="88" r="6" fill="#FFFFFF" />
    
    <!-- Upward trajectory pillar 1 -->
    <path d="M24 88 L24 24" stroke="#123C69" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Top-left Node -->
    <circle cx="24" cy="24" r="12" fill="#0E7490" />
    
    <!-- Diagonal Connection forming dynamic N and bridge to Industry Placement -->
    <path d="M24 24 L76 76" stroke="url(#nipun-diagonal-grad)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Center Pivot Node (Placement/Opportunity) - Bright Amber/Orange -->
    <circle cx="50" cy="50" r="8" fill="#F59E0B" />
    
    <!-- Right Pillar going upward into Career Growth -->
    <path d="M76 76 L76 14" stroke="#0E7490" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Peak Node / Growth Capstone (Green Arrow / Star Milestone) -->
    <circle cx="76" cy="14" r="14" fill="#16A34A" />
    <path d="M76 8 L81 16 L71 16 Z" fill="#FFFFFF" />
    
    <!-- Subtle Network Synapse Orbit Accent -->
    <path d="M12 56 C 28 36, 70 36, 88 56" stroke="#0E7490" stroke-width="2" stroke-dasharray="3 3" opacity="0.4"/>
  </g>

  <!-- Typography Lockup -->
  <!-- Primary Wordmark: NIPUN -->
  <text x="126" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#123C69" letter-spacing="1.5">NIPUN</text>
  
  <!-- Status Chip / Seal Accent -->
  <rect x="296" y="27" width="84" height="24" rx="12" fill="#F4F8FC" stroke="#0E7490" stroke-width="1.5"/>
  <circle cx="308" cy="39" r="4" fill="#16A34A"/>
  <text x="318" y="43" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="10" fill="#0E7490" letter-spacing="0.5">NATIONAL</text>

  <!-- Tagline / Descriptor -->
  <text x="127" y="82" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="13.5" fill="#0E7490" letter-spacing="0.4">NATIONAL INDUSTRY PLACEMENT &amp; UPSKILLING NETWORK</text>
  
  <!-- Sub-credential / Institutional Trust line -->
  <text x="127" y="99" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="10.5" fill="#64748B" letter-spacing="0.2">Apex Bridge for Student Employability &amp; Enterprise Workforce Alignment</text>

  <defs>
    <linearGradient id="nipun-diagonal-grad" x1="24" y1="24" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#123C69"/>
    </linearGradient>
  </defs>
</svg>